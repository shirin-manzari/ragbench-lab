[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ragbench-lab"
version = "0.1.0"
description = "A local benchmark for controlled RAG experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ragbench = "ragbench_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench_lab"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
