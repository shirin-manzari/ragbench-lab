[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ragbench-lab"
version = "0.1.0"
description = "A local benchmark for controlled RAG experiments"
requires-python = ">=3.11"
dependencies = [
    "tokenizers==0.22.1", "torch==2.9.1", "transformers==5.0.0",
    "faiss-cpu==1.13.2", "numpy==2.3.5", "certifi==2026.7.22",
]

[project.optional-dependencies]
dashboard = ["dash==4.4.1", "plotly==7.1.0"]

[project.scripts]
ragbench = "ragbench_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbench_lab"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
