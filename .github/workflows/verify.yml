name: verify checkout

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    steps:
      - name: check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: select python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: verify without site packages or checkout working directory
        shell: bash
        working-directory: ${{ runner.temp }}
        run: python -I -S -B "$GITHUB_WORKSPACE/scripts/verify_checkout.py"
      - name: verify with assertions disabled
        shell: bash
        working-directory: ${{ runner.temp }}
        run: python -I -S -B -O "$GITHUB_WORKSPACE/scripts/verify_checkout.py" --json
