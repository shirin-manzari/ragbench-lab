# Stage A study scope: full prepared corpora, 50 development / 100 held-out.
# Source revisions and hashes live in the separate prepared-data manifests.
# Selection and timing rules match retrieval-pilot.toml; only sample counts/name differ.
# Prepare new data directories; never overwrite or reinterpret the 10/10 pilots.
schema_version = 1
name = "stage-a-study-v1"

[dataset]
names = ["squad", "hotpot_qa"]
revision = "see-prepared-source-manifests"
development_questions = 50
evaluation_questions = 100
sampling_seed = 20261011

[retrieval]
recipes = ["bm25", "dense_bge", "dense_e5", "hybrid_bge", "hybrid_e5"]
candidate_depth = 50
rrf_constant = 60
context_budget_tokens = 1024

[bm25]
k1 = 1.5
b = 0.75
preprocessing = "unicode_words_casefold_v1"
idf = "log1p_robertson_v1"

[chunking]
methods = ["fixed_token", "sentence_aware"]
sizes = [64, 128, 256]
overlap_percent = 0
reference_tokenizer = "BAAI/bge-small-en-v1.5"
tokenizer_revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
tokenizer_sha256 = "d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66"

[embedding]
bge_revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
e5_revision = "ffb93f3bd4047442299a41ebb6fa998a38507c52"
device = "cpu"
batch_size = 16
threads = 4
seed = 20261011

[timing]
repetitions = 3
sequential = true
quality_repetition = 1
